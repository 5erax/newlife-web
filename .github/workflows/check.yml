name: Check game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run simulate -- 10000 --report | tee simulation-report.txt
      - run: npx tsx src/tools/casino-simulation.ts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: simulation-report
          path: |
            simulation-report.txt
            docs/qa/expansion-simulation.json
            docs/qa/branch-coverage.json
            docs/qa/casino-simulation.json
